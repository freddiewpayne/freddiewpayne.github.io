<!DOCTYPE html>
<html lang="en-GB">
    <head>
        <title>freddiewpayne</title>
        <link rel="icon" type="image/x-icon" href="/media/shared/Dino_Idle0.png" />

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=SUSE:wght@100..800&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="/css/globals.css" />
        <link rel="stylesheet" href="/css/template.css" />
        <link rel="stylesheet" href="/css/cv-game.css" />

        <script src="/compiled-js/template.js"></script>
    </head>
    <body>
        <div id="cv-game-container">
            <canvas id="unity-canvas" width=800 height=600 style="width: 800px; height: 600px; background: #231F20"></canvas>
            <script src="Build/1.5.1.loader.js"></script>
            <script>
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                // Mobile device style: fill the whole browser client area with the game canvas:
                var meta = document.createElement('meta');
                meta.name = 'viewport';
                meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
                document.getElementsByTagName('head')[0].appendChild(meta);

                var canvas = document.querySelector("#unity-canvas");
                canvas.style.width = "100%";
                canvas.style.height = "100%";
                canvas.style.position = "fixed";

                document.body.style.textAlign = "left";
            }

            createUnityInstance(document.querySelector("#unity-canvas"), {
                dataUrl: "Build/1.5.1.data.unityweb",
                frameworkUrl: "Build/1.5.1.framework.js.unityweb",
                codeUrl: "Build/1.5.1.wasm.unityweb",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "DefaultCompany",
                productName: "Freddie Payne's CV",
                productVersion: "1.5.1",
                // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
                // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
            });
            </script>
        </div>
    </body>
</html>
